title: CreateActorRequest
type: object
properties:
  name:
    type: [string, "null"]
    example: MyActor
  description:
    type: [string, "null"]
    example: My favourite actor!
  title:
    type: [string, "null"]
    example: My actor
  isPublic:
    type: [boolean, "null"]
    example: false
  seoTitle:
    type: [string, "null"]
    example: My actor
  seoDescription:
    type: [string, "null"]
    example: My actor is the best
  restartOnError:
    type: boolean
    example: false
    deprecated: true # Use defaultRunOptions.restartOnError instead
  versions:
    type: [array, "null"]
    items:
      $ref: "./Version.yaml"
    description: ''
  pricingInfos:
    type: array
    items:
      $ref: ../actor-pricing-info/ActorRunPricingInfo.yaml
  categories:
    type: [array, "null"]
    items:
      type: string
    description: ''
  defaultRunOptions:
    $ref: ./DefaultRunOptions.yaml
