title: CreateOrUpdateVersionRequest
type: object
properties:
  versionNumber:
    type: [string, "null"]
    example: '0.0'
  sourceType:
    anyOf:
      - $ref: ./VersionSourceType.yaml
      - type: "null"
  envVars:
    type: [array, "null"]
    items:
      $ref: "./EnvVar.yaml"
    description: ''
  applyEnvVarsToBuild:
    type: [boolean, "null"]
    example: false
  buildTag:
    type: [string, "null"]
    example: latest
  sourceFiles:
    $ref: ./VersionSourceFiles.yaml
