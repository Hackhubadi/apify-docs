title: Version
type: object
required:
  - versionNumber
  - sourceType
properties:
  versionNumber:
    type: string
    example: '0.0'
  sourceType:
    anyOf:
      - $ref: ./VersionSourceType.yaml
      - type: "null"
  envVars:
    type: [array, "null"]
    items:
      $ref: ./EnvVar.yaml
    description: ''
  applyEnvVarsToBuild:
    type: [boolean, "null"]
    example: false
  buildTag:
    type: string
    example: latest
  sourceFiles:
    $ref: ./VersionSourceFiles.yaml
