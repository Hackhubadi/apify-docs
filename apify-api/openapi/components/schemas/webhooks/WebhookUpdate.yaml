title: WebhookUpdate
type: object
properties:
  isAdHoc:
    type: [boolean, "null"]
    example: false
  eventTypes:
    type: [array, "null"]
    items:
      $ref: ./WebhookEventType.yaml
    description: ''
    example: ACTOR.RUN.SUCCEEDED
  condition:
    anyOf:
      - $ref: ./WebhookCondition.yaml
      - type: "null"
  ignoreSslErrors:
    type: [boolean, "null"]
    example: false
  doNotRetry:
    type: [boolean, "null"]
    example: false
  requestUrl:
    type: [string, "null"]
    example: 'http://example.com/'
  payloadTemplate:
    type: [string, "null"]
    example: '{\n \"userId\": {{userId}}...'
  headersTemplate:
    type: [string, "null"]
    example: '{\n \"Authorization\": Bearer...'
  description:
    type: [string, "null"]
    example: this is webhook description
  shouldInterpolateStrings:
    type: [boolean, "null"]
    example: false
