title: WebhookShort
required:
  - id
  - createdAt
  - modifiedAt
  - userId
  - eventTypes
  - condition
  - ignoreSslErrors
  - doNotRetry
  - requestUrl
type: object
properties:
  id:
    type: string
    example: YiKoxjkaS9gjGTqhF
  createdAt:
    type: string
    format: date-time
    example: '2019-12-12T07:34:14.202Z'
  modifiedAt:
    type: string
    format: date-time
    example: '2019-12-13T08:36:13.202Z'
  userId:
    type: string
    example: wRsJZtadYvn4mBZmm
  isAdHoc:
    type: [boolean, "null"]
    example: false
  shouldInterpolateStrings:
    type: [boolean, "null"]
    example: false
  eventTypes:
    type: array
    items:
      $ref: ./WebhookEventType.yaml
    example: ACTOR.RUN.SUCCEEDED
  condition:
    $ref: ./WebhookCondition.yaml
  ignoreSslErrors:
    type: boolean
    example: false
  doNotRetry:
    type: boolean
    example: false
  requestUrl:
    type: string
    example: 'http://example.com/'
  lastDispatch:
    anyOf:
      - $ref: ./ExampleWebhookDispatch.yaml
      - type: "null"
  stats:
    anyOf:
      - $ref: ./WebhookStats.yaml
      - type: "null"
