title: WebhookCreate
required:
  - eventTypes
  - condition
  - requestUrl
type: object
properties:
  isAdHoc:
    type: [boolean, "null"]
    example: false
  eventTypes:
    type: array
    items:
      $ref: ./WebhookEventType.yaml
    example: ACTOR.RUN.SUCCEEDED
  condition:
    $ref: ./WebhookCondition.yaml
  idempotencyKey:
    type: [string, "null"]
    example: fdSJmdP3nfs7sfk3y
  ignoreSslErrors:
    type: [boolean, "null"]
    example: false
  doNotRetry:
    type: [boolean, "null"]
    example: false
  requestUrl:
    type: string
    example: 'http://example.com/'
  payloadTemplate:
    type: [string, "null"]
    example: '{\n \"userId\": {{userId}}...'
  headersTemplate:
    type: [string, "null"]
    example: '{\n \"Authorization\": Bearer...'
  description:
    type: [string, "null"]
    example: this is webhook description
  shouldInterpolateStrings:
    type: [boolean, "null"]
    example: false
