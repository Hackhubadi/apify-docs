title: CreateScheduleActions
required:
  - type
  - actorId
type: object
properties:
  type:
    type: string
    example: RUN_ACTOR
  actorId:
    type: string
    example: jF8GGEvbEg4Au3NLA
  runInput:
    anyOf:
      - $ref: ./ScheduleActionsRunInput.yaml
      - type: "null"
  runOptions:
    anyOf:
      - $ref: ./ScheduleActionsRunOptions.yaml
      - type: "null"

